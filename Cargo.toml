[package]
name = "bpcodec"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[features]
default = []
metal = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
rayon = "1.10"
sha2 = "0.10"

